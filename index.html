const tabs=[['home','🏠','الرئيسية'],['stk','🐥','المخزون'],['sale','💰','بيع'],['buy','🛒','شراء'],['xfer','🔀','تحويلات'],['dead','☠️','نافق'],['exp','💸','مصروفات'],['ppl','👥','عملاء وموردين'],['rep','📊','تقارير'],['set','⚙️','الإعدادات']];
mig();
let BR='m';const MB=()=>D.br.length>1,BN=i=>(D.br.find(b=>b.id==i)||{name:'؟'}).name,bx=x=>x.br||'m',fixBR=()=>{BR=D.br.length==1?D.br[0].id:(D.cur=='all'||D.br.some(b=>b.id==D.cur)?D.cur:D.br[0].id)},inBr=x=>BR=='all'||bx(x)==BR||((x.k=='xfer'||x.k=='cxfer')&&(x.from==BR||x.to==BR)),PB=()=>D.parties.filter(p=>BR=='all'||p.br==BR),TXB=()=>D.tx.filter(inBr),canW=()=>BR!='all'||(alert('اختار فرع محدد من القايمة فوق علشان تسجل عمليات'),false),setBR=v=>{BR=v;D.cur=v;save();go()};fixBR();

// المحرك: إعادة حساب كل شيء بالترتيب الزمني بمتوسط التكلفة المرجح
function engine(){
 const B={},m={},mi={},bal={};D.br.forEach(b=>B[b.id]={st:{},cash:+b.cash0||0});
 D.types.forEach(t=>{const o=t.obs||{};for(const b in o){const q=+o[b]||0;if(q>0&&B[b])B[b].st[t.id]={q,v:n(q*(+t.cost||0)),l:+t.cost||0}}});
 D.parties.forEach(p=>bal[p.id]=+p.open||0);
 const S=(b,t)=>B[b].st[t]=B[b].st[t]||{q:0,v:0,l:0},fin=s=>{if(s.q<=0)s.v=0},av=s=>s.q>0?s.v/s.q:s.l;
 [...D.tx].sort((a,b)=>a.d+a.id>b.d+b.id?1:-1).forEach(x=>{const b=B[x.br]?x.br:'m',C=B[b];
  if(x.k=='buy'){items(x).forEach(i=>{const s=S(b,i.t);s.q+=i.q;s.v+=i.q*i.p;s.l=i.p;fin(s)});C.cash-=x.paid;if(x.pt)bal[x.pt]+=tot(x)-x.paid}
  else if(x.k=='sale'){const cs=items(x).map(i=>{const s=S(b,i.t),c=i.q*av(s);s.q-=i.q;s.v-=c;fin(s);return c});mi[x.id]=cs;m[x.id]=cs.reduce((a,c)=>a+c,0);C.cash+=x.paid;if(x.pt)bal[x.pt]+=tot(x)-x.paid}
  else if(x.k=='dead'){const s=S(b,x.t),c=x.q*av(s);m[x.id]=c;s.q-=x.q;s.v-=c;fin(s)}
  else if(x.k=='xfer'){if(!B[x.from]||!B[x.to])return;const cs=items(x).map(i=>{const s=S(x.from,i.t),c=i.q*av(s);s.q-=i.q;s.v-=c;fin(s);const d=S(x.to,i.t);d.q+=i.q;d.v+=c;d.l=i.q?c/i.q:d.l;fin(d);return c});mi[x.id]=cs;m[x.id]=cs.reduce((a,c)=>a+c,0)}
  else if(x.k=='cxfer'){if(!B[x.from]||!B[x.to])return;const a=+x.a||0;B[x.from].cash-=a;B[x.to].cash+=a}
  else if(x.k=='exp')C.cash-=x.a;
  else if(x.k=='col'){C.cash+=x.a;bal[x.pt]-=x.a}
  else if(x.k=='pay'){C.cash-=x.a;bal[x.pt]-=x.a}
 });return{B,m,mi,bal};
}
function calc(b){b=b||BR;const e=engine(),ids=b=='all'?D.br.map(x=>x.id):[e.B[b]?b:'m'],st={};let cash=0;
 ids.forEach(i=>{cash+=e.B[i].cash;for(const t in e.B[i].st){const s=e.B[i].st[t],r=st[t]=st[t]||{q:0,v:0,l:s.l};r.q+=s.q;r.v+=s.v}});

}
function form(title,fs,ok,ch){

}
